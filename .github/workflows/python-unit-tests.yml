name: python-unit-tests

# WHY THIS EXISTS (K28, 2026-07-24).
# The repo's CI ran `go test` + `cargo test` ONLY — a repo-wide grep found ZERO `pytest`
# invocations across all workflows, and the pre-commit hook runs static gates with "no suite
# execution". So the Python services' test suites — chat 1906, knowledge 4075, composition
# 2387, translation 1054, jobs 98, lore-enrichment 965 — gated NOTHING automatically. They
# passed only when a developer ran pytest by hand. A future break merged clean, and the
# DB-integration suites had already silently rotted from schema drift (K27) precisely because
# nothing ever ran them.
#
# This is the Python counterpart to domain-db-smoke.yml, which fixed the same "green by skip"
# class for book + glossary (both Go) on 2026-07-11 but was never extended to Python.
#
# SCOPE — UNIT TESTS ONLY, deliberately (step 1 of the K28 remediation).
#  - The DB-gated integration tests (tests/integration/db/**) SKIP here: no TEST_*_DB_URL /
#    TEST_NEO4J_URI is set, exactly as they do on a dev laptop. Wiring those needs an
#    ephemeral Postgres + a Neo4j service container AND the K27 fixture rot repaired first, so
#    it is a follow-up job (python-integration-tests) — see K27/K28 in the RUN-STATE ledger.
#  - Run SERIAL (no pytest-xdist): a gating job must be deterministic, and one cross-file
#    xdist isolation flake exists in lore-enrichment (test_tool_carries_valid_meta RuntimeErrors
#    intermittently under -n auto, passes in isolation). Speeding this up with xdist waits on
#    fixing that isolation bug.
#
# Python 3.12 to match the service Dockerfiles (python:3.12-slim) — and loreweave_llm in the
# shared SDK declares requires-python >= 3.11, so 3.10 would fail to install the SDK.
#
# Path-filtered: runs only when a Python service or the shared Python SDK changes.

on:
  push:
    branches: ["**"]
    paths:
      - "services/**"
      - "sdks/python/**"
      - ".github/workflows/python-unit-tests.yml"
  pull_request:
    branches: ["**"]
    paths:
      - "services/**"
      - "sdks/python/**"
      - ".github/workflows/python-unit-tests.yml"

permissions:
  contents: read

jobs:
  unit:
    name: ${{ matrix.service }} (pytest, unit)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Services whose unit suites are verified green (2026-07-24). The remaining Python
        # services (campaign, learning, video-gen, worker-ai) are a follow-up — add each here
        # only after its unit suite is confirmed green, so this job never arrives red.
        service:
          - chat-service
          - knowledge-service
          - composition-service
          - translation-service
          - jobs-service
          - lore-enrichment-service
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: install the shared Python SDK
        # The bundle in sdks/python (one pyproject, many loreweave_* modules) is what every
        # service Dockerfile installs as `pip install /sdk`. It also brings pytest +
        # pytest-asyncio, so services with no requirements-test.txt still have a runner.
        run: python -m pip install --upgrade pip && python -m pip install ./sdks/python
      - name: install service dependencies
        run: |
          python -m pip install -r "services/${{ matrix.service }}/requirements.txt"
          if [ -f "services/${{ matrix.service }}/requirements-test.txt" ]; then
            python -m pip install -r "services/${{ matrix.service }}/requirements-test.txt"
          fi
      - name: pytest (unit — integration/db SKIPs without a DB env)
        # No TEST_*_DB_URL / TEST_NEO4J_URI on purpose: the DB-gated integration tests skip,
        # leaving the unit surface. Serial for determinism (see the flake note above).
        working-directory: "services/${{ matrix.service }}"
        run: python -m pytest tests -q -p no:cacheprovider
