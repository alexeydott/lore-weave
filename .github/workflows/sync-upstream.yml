name: sync upstream

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: merge upstream main
        run: |
          git remote add upstream https://github.com/letuhao/lore-weave.git
          git fetch upstream main
          git merge --no-edit upstream/main

      - name: keep local state out of the fork
        run: |
          git rm -r --cached --ignore-unmatch .agents .ai-factory .claude .codex .cursor .github/skills .ai-factory.json
          git rm -r --cached --ignore-unmatch docs/dev/LOCAL_TEST_ENV.md .env .envrc
          git ls-files -z -- ':(glob)**/.env' ':(glob)**/.env.local' ':(glob)**/.env.*.local' | xargs -0 -r git rm --cached --ignore-unmatch --
          git add .gitignore

      - name: verify fork-local paths are untracked
        run: |
          blocked="$(git ls-files -- .agents .ai-factory .claude .codex .cursor .github/skills .ai-factory.json docs/dev/LOCAL_TEST_ENV.md .env .envrc ':(glob)**/.env' ':(glob)**/.env.local' ':(glob)**/.env.*.local')"
          if [ -n "$blocked" ]; then
            echo "Fork-local state must not be tracked:" >&2
            echo "$blocked" >&2
            exit 1
          fi

      - name: commit and push when upstream changed
        run: |
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: sync upstream main"
          git push origin main
