name: dep-vuln

# SEC-11 / audit P1: dependency (CVE) vulnerability scanning for EVERY ecosystem
# the monorepo ships — Go, Python, JS/TS (npm + pnpm), Rust. Today this is ZERO
# (lockfile pinning ≠ vuln scanning), so the goal here is VISIBILITY FIRST.
#
# ADVISORY on day one: every job is `continue-on-error: true`, so a newly-disclosed
# CVE surfaces as a red-but-non-blocking check and never blocks a merge. Once the
# baseline is clean and triaged, individual legs can be flipped to blocking by
# removing `continue-on-error`. Dependabot (`.github/dependabot.yml`) opens the
# bump PRs; these jobs report what is currently vulnerable.

on:
  push:
    branches: [main, "mmo-rpg/**"]
  pull_request:
    branches: [main, "mmo-rpg/**"]
  schedule:
    # Weekly Monday 06:00 UTC — catch CVEs disclosed against already-pinned deps.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go-vuln:
    name: Go — govulncheck (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          # Patch-exact: the 1.26 series' crypto/x509 fix (GO-2026-6809) lands
          # in 1.26.10, and the net/http MaxBytesReader fix (GO-2026-6859)
          # lands in 1.26.11 — a bare "1.26" resolved an older patch on the
          # runner and kept flagging the stdlib. Bump this patch alongside
          # the scanner pin.
          go-version: "1.26.11"
          # 🔴 The repo ROOT has no go.mod, so setup-go's dependency cache
          # cannot compute a key ("Primary key was not generated") and its
          # POST step fails the job — even when every module scanned clean
          # ("affected by 0 vulnerabilities" across the board, measured
          # 2026-10-24 on e361fa784). No cache for this advisory job.
          cache: false
      # 🔴 THE TOOLCHAIN AND THE SCANNER MUST MOVE TOGETHER. govulncheck
      # versions declare the Go line they require: v1.8.0+ needs go 1.26, and
      # v1.7.0 (the last accepting 1.25) runs but then flags every module with
      # go1.25 STDLIB advisories (crypto/x509, net/http, crypto/tls — fixed
      # only in 1.26.x patches) — a red X that says "your scanner's stdlib is
      # old", not "your code is vulnerable". Pin the scanner (never @latest:
      # v1.9.0 declares go 1.26 too, but the next bump will break this again)
      # and bump BOTH this pin and go-version together.
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
      - name: govulncheck every go.mod module
        shell: bash
        run: |
          set -uo pipefail
          fail=0
          while IFS= read -r mod; do
            dir=$(dirname "$mod")
            echo "::group::govulncheck $dir"
            if ! ( cd "$dir" && govulncheck ./... ); then
              echo "::warning::govulncheck findings in $dir"
              fail=1
            fi
            echo "::endgroup::"
          done < <(find . -name go.mod -not -path '*/.git/*' -not -path '*/.claude/*')
          # Non-zero surfaces the findings; job-level continue-on-error keeps it advisory.
          exit $fail

  python-vuln:
    name: Python — pip-audit (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pip-audit
      - name: pip-audit every service requirements + the python SDK
        shell: bash
        run: |
          set -uo pipefail
          fail=0
          # Runtime + test requirements across all Python services.
          while IFS= read -r req; do
            echo "::group::pip-audit $req"
            req_dir=$(dirname "$req")
            req_file=$(basename "$req")
            # Pip resolves editable local requirements relative to its current
            # directory. Audit from the requirement's directory so, for example,
            # lore-enrichment's `-e ../../sdks/python` stays within the checkout.
            if ! ( cd "$req_dir" && pip-audit --progress-spinner off -r "$req_file" ); then
              echo "::warning::pip-audit findings in $req"
              fail=1
            fi
            echo "::endgroup::"
          done < <(find services -name 'requirements*.txt' -not -path '*/.claude/*'; find infra -name 'requirements*.txt' 2>/dev/null)
          # sdks/python is a pyproject project — audit it as a project tree.
          if [ -f sdks/python/pyproject.toml ]; then
            echo "::group::pip-audit sdks/python"
            if ! pip-audit --progress-spinner off ./sdks/python; then
              echo "::warning::pip-audit findings in sdks/python"
              fail=1
            fi
            echo "::endgroup::"
          fi
          exit $fail

  npm-vuln:
    name: JS/TS — npm/pnpm audit (frontend + gateways) (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "20"
      - run: npm install -g pnpm@9
      - name: npm audit each standalone package-lock (gateways + frontends)
        shell: bash
        run: |
          set -uo pipefail
          fail=0
          # Each dir with its own package-lock.json (frontend keeps its own npm
          # workflow; the gateways + cms-frontend each vendor a lockfile).
          while IFS= read -r lock; do
            dir=$(dirname "$lock")
            echo "::group::npm audit $dir"
            if ! ( cd "$dir" && npm audit --audit-level=high ); then
              echo "::warning::npm audit findings in $dir"
              fail=1
            fi
            echo "::endgroup::"
          done < <(find . -name package-lock.json -not -path '*/node_modules/*' -not -path '*/.claude/*')
          # pnpm workspace at the repo root (frontend-game + packages/*).
          if [ -f pnpm-lock.yaml ]; then
            echo "::group::pnpm audit (root workspace)"
            if ! pnpm audit --audit-level high; then
              echo "::warning::pnpm audit findings in root workspace"
              fail=1
            fi
            echo "::endgroup::"
          fi
          exit $fail

  cargo-vuln:
    name: Rust — cargo audit (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo install cargo-audit --locked
      - name: cargo audit (root workspace Cargo.lock)
        # Three --ignore entries are advisories with NO in-range fix today
        # (2026-10-24 for the first two, 2026-11-12 for the third), the
        # first two reached only through jsonwebtoken v10.4.0:
        #   RUSTSEC-2023-0071 — rsa "Marvin Attack". No fixed rsa release
        #     exists at all; our use is JWT sign/verify, not the RSA
        #     decryption the attack requires.
        #   RUSTSEC-2026-0387 — crypto-bigint timing; the sole patched line
        #     is >=0.7.6 while our copy is 0.5.5, pinned by
        #     elliptic-curve 0.13 <- ecdsa/p256 <- jsonwebtoken.
        #   RUSTSEC-2026-0459 — libsqlite3-sys 0.30.1, C SQLite
        #     CVE-2026-119375. No in-range fix: the newest sqlx 0.9.0
        #     (sqlx-sqlite 0.9.0) caps libsqlite3-sys at <0.38.0 while the
        #     patched line is >=0.39.0 (checked 2026-11-12 on crates.io).
        #     And the vulnerable code is not in the build at all:
        #     sqlx-sqlite is absent from `cargo tree -p sqlx` (only the
        #     postgres backend is enabled) and libsqlite3-sys is built
        #     without its `bundled` feature, linking the system libsqlite3.
        # Lift ALL THREE when the upstream bumps land (jsonwebtoken's
        # RustCrypto stack for the first two, a sqlx release allowing
        # libsqlite3-sys >=0.39.0 for the third — Dependabot will open
        # those PRs); until then these three would keep this advisory
        # leg permanently red over unfollowable findings.
        run: cargo audit --ignore RUSTSEC-2023-0071 --ignore RUSTSEC-2026-0387 --ignore RUSTSEC-2026-0459
